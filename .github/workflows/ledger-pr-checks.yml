name: Ledger PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [feat/client-ledger-workflow-foundation]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Ledger payment unit tests
        run: npm run test:ledger
      - name: Production build
        run: npm run build

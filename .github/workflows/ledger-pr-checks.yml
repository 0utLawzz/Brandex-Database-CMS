name: Ledger PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [feat/client-ledger-workflow-foundation]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Install isolated Vitest runner
        run: |
          mkdir -p /tmp/ledger-test-runner
          cd /tmp/ledger-test-runner
          npm init -y
          npm install vitest@4.1.11
      - name: Run ledger payment unit test
        run: /tmp/ledger-test-runner/node_modules/.bin/vitest run src/lib/ledgerPayments.test.ts
      - name: Production build
        run: npm run build
